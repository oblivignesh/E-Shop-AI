[project]
name = "aura"
version = "0.1.0"
description = "AURA — Autonomous E-commerce Operations Agent (LangGraph portfolio project)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "AURA" }]
dependencies = [
    # Agent orchestration
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.5",
    # RAG
    "chromadb>=0.5.15",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.2",
    "sentence-transformers>=3.2.1",
    # Data
    "sqlalchemy>=2.0.35",
    "pandas>=2.2.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    # UI
    "streamlit>=1.40.0",
    # Ops
    "python-dotenv>=1.0.1",
    "langsmith>=0.1.140",
    "rich>=13.9.4",
    "typer>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.4",
    "mypy>=1.13.0",
]
evals = [
    "ragas>=0.2.6",
    "datasets>=3.1.0",
]
guardrails = [
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
]

[project.scripts]
aura = "aura.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
